name: release

# Pushing a tag like v1.1.0 publishes a release with termnook.zip (only the program files),
# which nook update installs for copies that are not git clones.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: zip termnook.zip termnook.ps1 config.example.psd1 logo.txt install.ps1 README.md LICENSE .gitignore
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" termnook.zip --title "TermNook ${{ github.ref_name }}" --generate-notes \
            || gh release upload "${{ github.ref_name }}" termnook.zip --clobber
